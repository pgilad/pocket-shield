name: Publish container image

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - config.example.toml
      - Dockerfile
      - docker-bake.hcl
      - .dockerignore
      - .github/workflows/*.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-image
  cancel-in-progress: false

env:
  REVISION: ${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.image.outputs.exists }}
      tag: ${{ steps.image.outputs.tag }}
      repository: ${{ steps.image.outputs.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether image already exists
        id: image
        shell: bash
        run: |
          tag=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d.%H%M%S)
          image=$(TAG="$tag" docker buildx bake --print | jq -er '.target.release.tags[0]')
          error_file="$RUNNER_TEMP/image-inspect-error"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "repository=${image%:*}" >> "$GITHUB_OUTPUT"

          if docker buildx imagetools inspect "$image" > /dev/null 2> "$error_file"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Skip publishing: $image already exists." >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fxq "ERROR: $image: not found" "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/bake-action@v7.5.0
        with:
          set: |
            release.platform=${{ matrix.platform }}
            release.tags=${{ needs.prepare.outputs.repository }}
            release.output=type=image,push-by-digest=true,name-canonical=true,push=true
            release.cache-from=type=gha,scope=build-${{ matrix.cache }}
            release.cache-to=type=gha,scope=build-${{ matrix.cache }},mode=max

      - name: Save image digest
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          digest=$(jq -er '.release["containerimage.digest"]' <<< "$BUILD_METADATA")
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.cache }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.prepare.outputs.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download image digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform tags
        shell: bash
        run: |
          docker buildx bake --print > "$RUNNER_TEMP/bake.json"
          mapfile -t image_tags < <(jq -er '.target.release.tags[]' "$RUNNER_TEMP/bake.json")

          tags=()
          for tag in "${image_tags[@]}"; do
            tags+=(--tag "$tag")
          done

          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"
